  <script>/** Core musical model: immutable anchor references to syllable IDs. */
const NOTE_NAMES = ['DO', 'DO#', 'RE', 'RE#', 'MI', 'FA', 'FA#', 'SOL', 'SOL#', 'LA', 'LA#', 'SI'];
const SEMITONE = { DO: 0, RE: 2, MI: 4, FA: 5, SOL: 7, LA: 9, SI: 11 };
const SPELLINGS = { 'RE#': 'MIb', 'LA#': 'SIb' };

function parseSyllables(marked) {
  // Pipes delimit MUSICAL syllable cells. Spaces remain literal and aren't counted as syllables.
  const result = [];
  let slot = 0;
  for (const chunk of String(marked).split(/(\s+)/)) {
    if (!chunk) continue;
    if (/^\s+$/.test(chunk)) result.push({ id: null, text: chunk, space: true });
    else for (const syl of chunk.split('|')) {
      if (syl) result.push({ id: `s${slot++}`, text: syl, space: false });
    }
  }
  return result;
}

function transposeChord(chord, semitones) {
  if (!semitones || !chord) return chord;
  const normalized = String(chord).replace(/♯/g, '#').replace(/♭/g, 'b');
  const m = normalized.match(/^(SOL|DO|RE|MI|FA|LA|SI)(#|b)?(.*)$/i);
  if (!m) return chord; // Never silently rewrite an unsupported symbol.
  const root = m[1].toUpperCase();
  let note = SEMITONE[root];
  if (m[2] === '#') note += 1;
  if (m[2] === 'b') note -= 1;
  const next = ((note + semitones) % 12 + 12) % 12;
  // Keep original chord qualities/suffixes intact, including -, 2, 4, 7 and slash bass.
  let suffix = m[3] || '';
  const bass = suffix.match(/\/(SOL|DO|RE|MI|FA|LA|SI)(#|b)?$/i);
  if (bass) {
    const bRoot = SEMITONE[bass[1].toUpperCase()] + (bass[2] === '#' ? 1 : bass[2] === 'b' ? -1 : 0);
    const bNext = ((bRoot + semitones) % 12 + 12) % 12;
    suffix = suffix.slice(0, -bass[0].length) + '/' + NOTE_NAMES[bNext];
  }
  return NOTE_NAMES[next] + suffix;
}

function normalizedSong(song) {
  const clone = structuredClone(song);
  for (const sec of clone.sections || []) {
    for (const line of sec.lines || []) {
      if (!Array.isArray(line.anchors)) line.anchors = [];
      const slotCount = parseSyllables(line.marked || '').filter(x => !x.space).length;
      line.anchors = line.anchors.filter(a => Number.isInteger(a.slot) && a.slot >= 0 && a.slot < slotCount && typeof a.chord === 'string');
    }
  }
  return clone;
}

function chordLineCount(song) {
  return (song.sections || []).reduce((sum, sec) => sum + (sec.lines || []).reduce((n, ln) => n + (ln.anchors || []).length, 0), 0);
}

const DEFAULT_MASSES = [

];
const KEY = 'cantoria-v1-local';
function seed() { return { songs: structuredClone(DEMO_SONGS), masses: structuredClone(DEFAULT_MASSES), created: new Date().toISOString() }; }
function loadStore() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed.songs) && Array.isArray(parsed.masses)) return parsed; } } catch(e) { /* private storage disabled */ }
  return seed();
}
function saveStore(store) { try { localStorage.setItem(KEY, JSON.stringify(store)); return true; } catch(e) { return false; } }
function exportJSON(store) { const blob = new Blob([JSON.stringify(store,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a');a.href=url;a.download='Cantoria-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000); }

const root = document.querySelector('#app');
const store = loadStore();
const state = { view: 'home', filter: '', massId: null, songId: null, massItemId: null, shift: 0, page: 0, modal: null, photoURL: null, toast: '', fontScale: 1 };
let toastTimer;
const escape = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeAttr = escape;
const labels = { library:'Biblioteca', masses:'Le mie Messe', capture:'Acquisisci', settings:'Impostazioni' };

function notify(message){state.toast=message;clearTimeout(toastTimer);render();toastTimer=setTimeout(()=>{state.toast='';render();},2400);}

function currentSong(){return store.songs.find(x=>x.id===state.songId);}
function currentMass(){return store.masses.find(x=>x.id===state.massId);}
function go(view){state.view=view;state.songId=null;state.modal=null;render();}
function chordLabel(c){return escape(transposeChord(c,state.shift)).replace(/(\d*[24])$/, s=>`<sup>${s}</sup>`);}
function introChords(section){return `<div class="music-row ${section.kind} chords-only"><div class="chord-band">${section.chordsOnly.map(c=>`<span class="chord-label">${chordLabel(c)}</span>`).join('')}</div></div>`;}
function outroChords(section){return (section.chordRows||[]).map(row=>`<div class="music-row ${section.kind} chords-only"><div class="chord-band">${row.map(c=>`<span class="chord-label">${chordLabel(c)}</span>`).join('')}</div></div>`).join('');}
function lineHTML(section,line,si,li,isPrint=false){
  const tokens = parseSyllables(line.marked);
  let slot=0;
  const lyrics=tokens.map(token=>token.space?`<span class="space-syl">${escape(token.text)}</span>`:`<span class="syllable ${isPrint?'':'clickable'}" data-slot="${slot++}" ${isPrint?'':`data-action="add-chord" data-section="${si}" data-line="${li}"`}>${escape(token.text)}</span>`).join('');
  const chords=(line.anchors||[]).map((a,ai)=>{
    const tag=isPrint?'span':'button';
    return `<${tag} class="chord-label ${isPrint?'':'editable'}" data-slot="${a.slot}" ${isPrint?'':`data-action="edit-chord" data-section="${si}" data-line="${li}" data-chord="${ai}"`} aria-label="Accordo ${escapeAttr(a.chord)}">${chordLabel(a.chord)}</${tag}>`;
  }).join('');
  return `<div class="music-row ${escapeAttr(section.kind)}" data-row="s${si}-l${li}"><div class="chord-band">${chords}</div><div class="lyric-line">${lyrics}</div></div>`;
}
function groupHeading(label,continued=false){return `<div class="section-title ${continued?'continued':''}">${escape(label)}${continued?' · segue':''}</div>`;}
function sectionsAllHTML(song,isPrint=false){return (song.sections||[]).map((sec,si)=>`<section class="music-group ${isPrint?'print-section':''}">${groupHeading(sec.name)}${sec.chordsOnly?introChords(sec):''}${(sec.lines||[]).map((ln,li)=>lineHTML(sec,ln,si,li,isPrint)).join('')}${sec.chordRows?outroChords(sec):''}</section>`).join('');}
function flatEntries(song){const res=[];(song.sections||[]).forEach((sec,si)=>{if(sec.chordsOnly)res.push({si,type:'intro',sec,first:true});(sec.lines||[]).forEach((line,li)=>res.push({si,type:'line',sec,line,li,first:li===0}));(sec.chordRows||[]).forEach((row,i)=>res.push({si,type:'outro',sec,row,first:i===0}));});return res;}
function pageList(song){
 const items=flatEntries(song),columns=readerColumns();
 if(!items.length)return [[[]]];
 const horizontal=window.innerWidth>window.innerHeight;
 const budget=Math.max(2.5,(window.innerHeight-(horizontal?79:135))/(horizontal?66:82));
 const pages=[];let index=0;
 while(index<items.length){
   const page=[];
   for(let col=0;col<columns;col++){
     const slice=[];let usage=0,lastSection=-1;
     while(index<items.length){
       const entry=items[index];
       const weight=(entry.type==='intro'?.9:entry.type==='outro'?.82:1)+(lastSection!==entry.si?.38:0);
       if(slice.length&&usage+weight>budget)break;
       usage+=weight;slice.push(entry);lastSection=entry.si;index++;
     }
     page.push(slice);
   }
   pages.push(page);
 }
 return pages;
}
function entriesHTML(entries){if(!entries.length)return '<p>Questo canto non ha ancora righe.</p>';let lastSection=-1;return entries.map((e,idx)=>{let heading='';if(e.si!==lastSection){heading=groupHeading(e.sec.name,!e.first);lastSection=e.si;}return heading+(e.type==='intro'?introChords(e.sec):e.type==='outro'?`<div class="music-row outro chords-only"><div class="chord-band">${e.row.map(c=>`<span class="chord-label">${chordLabel(c)}</span>`).join('')}</div></div>`:lineHTML(e.sec,e.line,e.si,e.li));}).join('');}

function readerHTML(){

 const font=Math.max(15,Math.min(26,perColumnWidth*(horizontal?.051:.058)));
 return `<div class="reader-layer" id="readerLayer" style="--reader-font:${font.toFixed(1)}px">
 <header class="reader-toolbar">

   <div class="reader-actions">

 if(state.view==='home')return `<header class="topbar topbar-home"><div class="brand"><div class="brand-mark">C</div><div><strong>Cantoria</strong><div class="brand-sub">Il tuo repertorio</div></div></div></header>`;

 return `<header class="topbar topbar-section"><button class="header-home-btn" data-nav="home" aria-label="Torna alla Home">‹ <span>Home</span></button><strong class="header-section-title">${titles[state.view]||'Cantoria'}</strong><div class="header-spacer"></div></header>`;
}
function navHTML(){const nav=Object.keys(labels);return `<nav class="sidenav">${nav.map(k=>`<button class="nav-item ${state.view===k?'active':''}" data-nav="${k}"><span class="ico">${icons[k]}</span>${labels[k]}</button>`).join('')}<div class="nav-helper">La tua biblioteca è salvata in questo dispositivo.<br><strong>Il cloud verrà aggiunto in una prossima versione.</strong></div></nav><nav class="bottom-nav">${nav.map(k=>`<button class="bottom-item ${state.view===k?'active':''}" data-nav="${k}"><span class="ico">${icons[k]}</span>${labels[k]}</button>`).join('')}</nav>`;}
function libraryHTML(){const songs=store.songs.filter(s=>(s.title||'').toLowerCase().includes(state.filter.toLowerCase()));return `<div class="page-heading"><div><div class="eyebrow">Il tuo repertorio</div><h1>Biblioteca musicale</h1><p>Ogni canto, pronto per essere letto, trasposto e inserito nella scaletta di una Messa.</p></div><button class="primary-btn" data-nav="capture">+ Aggiungi canto</button></div>
  <label class="search-bar">⌕ <input id="search" type="search" placeholder="Cerca un canto…" value="${escapeAttr(state.filter)}" autocomplete="off" aria-label="Cerca un canto"></label>
  <div class="tiles">${songs.map((song,i)=>`<article class="song-card"><div class="song-cover"><span class="big-cross">✝</span><div class="cover-label">${escape(song.title)}</div></div><div class="card-body"><div class="meta-row"><span class="pill">${escape(song.key||'Tonalità libera')}</span>${song.verified?'<span class="pill good">Verificato</span>':'<span class="pill warning">Da verificare</span>'}</div><h3 style="margin-top:12px">${escape(song.title)}</h3><p>${escape(song.subtitle||'Canto')} · ${(song.sections||[]).length} sezioni</p><div class="card-actions"><button class="primary-btn" data-action="read-song" data-song="${escapeAttr(song.id)}">Apri spartito →</button><button class="text-btn" data-action="add-to-mass" data-song="${escapeAttr(song.id)}">Aggiungi alla Messa</button></div></div></article>`).join('')||'<div class="empty">Nessun canto trovato.</div>'}</div>

function replaceSyllable(marked,slot,newText){
 let n=0;
 return String(marked).split(/(\s+)/).map(chunk=>{
  if(!chunk||/^\s+$/.test(chunk))return chunk;
  return chunk.split('|').map(item=>{
   if(!item)return item;
   if(n++===slot)return newText;
   return item;
  }).join('|');
 }).join('');
}

function alignChords(scope=document){for(const row of scope.querySelectorAll('.music-row:not(.chords-only)')){const band=row.querySelector('.chord-band'),lyric=row.querySelector('.lyric-line');if(!band||!lyric)continue;const b=band.getBoundingClientRect();for(const chord of row.querySelectorAll('.chord-label[data-slot]')){const syl=lyric.querySelector(`.syllable[data-slot="${chord.dataset.slot}"]`);if(!syl)continue;const r=syl.getBoundingClientRect();chord.style.left=(r.left-b.left)+'px';}}}

function createFromText(name,body){const sections=[];let sec=null;const lines=body.split(/\r?\n/);for(let raw of lines){raw=raw.trim();if(!raw)continue;const heading=raw.match(/^@(INTRO|STROFA|RITORNELLO|FINALE)(?:\s+(.*))?$/i);if(heading){const t=heading[1].toUpperCase();sec={id:makeId(),name:t==='FINALE'?'ACCORDI FINALI':t,kind:t==='INTRO'?'intro':t==='STROFA'?'verse':t==='RITORNELLO'?'chorus':'outro',lines:[]};if(t==='INTRO'&&heading[2])sec.chordsOnly=heading[2].split(/\s+/);if(t==='FINALE')sec.chordRows=heading[2]?[heading[2].split(/\s+/)]:[];sections.push(sec);continue;}
 if(!sec){sec={id:makeId(),name:'STROFA',kind:'verse',lines:[]};sections.push(sec);}
 if(sec.kind==='outro'){sec.chordRows.push(raw.split(/\s+/));continue;}
 if(sec.kind==='intro'){sec.chordsOnly=(sec.chordsOnly||[]).concat(raw.replace(/\[|\]/g,'').split(/\s+/));continue;}
 // Extract bracketed chord markers without changing the underlying syllable grid.
 const rawPositions=[];let clean='',cursor=0;for(const part of raw.matchAll(/\[([^\]]+)\]|[^\[]+/g)){if(part[1])rawPositions.push({at:clean.length,chord:part[1].trim()});else clean+=part[0];}
 const sylStarts=[];let atStart=true;for(let i=0;i<clean.length;i++){const c=clean[i];if(c==='|'||/\s/.test(c)){atStart=true;continue;}if(atStart){sylStarts.push(i);atStart=false;}}
 const anchors=rawPositions.map(c=>({slot:sylStarts.findIndex(p=>p>=c.at),chord:c.chord})).filter(a=>a.slot>=0);
 sec.lines.push({marked:clean,anchors});
}

function setupLongPress(){

let startX=0,startY=0;root.addEventListener('touchstart',e=>{if(!e.target.closest('#readerPaper')||e.target.closest('.modal-card'))return;const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;},{passive:true});
root.addEventListener('touchend',e=>{if(!e.target.closest('#readerPaper'))return;const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4){state.page+=dx<0?1:-1;state.page=Math.max(0,Math.min(pageList(currentSong()).length-1,state.page));render();}},{passive:true});
window.addEventListener('resize',()=>{if(state.songId){state.page=0;render();}});
window.addEventListener('beforeprint',()=>{const holder=document.querySelector('#print-sheet');if(holder&&currentSong()&&!holder.innerHTML)holder.innerHTML=`<div class="print-body"><div class="print-head">${escape(currentSong().title)}</div>${sectionsAllHTML(currentSong(),true)}</div>`;alignChords(holder||document);});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();</script>
</body>
</html>
