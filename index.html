  <script>/** Core musical model: immutable anchor references to syllable IDs. */
const NOTE_NAMES = ['DO', 'DO#', 'RE', 'RE#', 'MI', 'FA', 'FA#', 'SOL', 'SOL#', 'LA', 'LA#', 'SI'];
const SEMITONE = { DO: 0, RE: 2, MI: 4, FA: 5, SOL: 7, LA: 9, SI: 11 };
const SPELLINGS = { 'RE#': 'MIb', 'LA#': 'SIb' };

function parseSyllables(marked) {
  // Pipes delimit MUSICAL syllable cells. Spaces remain literal and aren't counted as syllables.
  const result = [];
  let slot = 0;
  for (const chunk of String(marked).split(/(\s+)/)) {
    if (!chunk) continue;
    if (/^\s+$/.test(chunk)) result.push({ id: null, text: chunk, space: true });
    else for (const syl of chunk.split('|')) {
      if (syl) result.push({ id: `s${slot++}`, text: syl, space: false });
    }
  }
  return result;
}

function transposeChord(chord, semitones) {
  if (!semitones || !chord) return chord;
  const normalized = String(chord).replace(/♯/g, '#').replace(/♭/g, 'b');
  const m = normalized.match(/^(SOL|DO|RE|MI|FA|LA|SI)(#|b)?(.*)$/i);
  if (!m) return chord; // Never silently rewrite an unsupported symbol.
  const root = m[1].toUpperCase();
  let note = SEMITONE[root];

  await loadOcrLibrary();
  worker=await window.Tesseract.createWorker('ita+eng',1,{logger:message=>{
   if(message.status==='recognizing text'&&typeof message.progress==='number')
    state.ocrStatus='Lettura della foto: '+Math.round(message.progress*100)+'%';
   else if(message.status==='loading language traineddata')
    state.ocrStatus='Preparazione OCR italiano e inglese…';
   const status=document.getElementById('ocrStatus');
   if(status)status.textContent=state.ocrStatus;
  }});
  await worker.setParameters({preserve_interword_spaces:"1"});
  const result=await worker.recognize(image,{}, {text:true,blocks:true});
  // Ignore stale OCR if the user has chosen a different photograph.
  if(image!==(state.songId?currentSong()?.photoData:state.photoURL))return;
  const metadata=window.CantoriaMetadata?.analyze(result.data)||null;
  state.photoMetadata=metadata;
  if(!state.songId){
   if(!state.photoTitle.trim()&&metadata?.title)state.photoTitle=metadata.title;
   if(!state.photoAuthor.trim()&&metadata?.author)state.photoAuthor=metadata.author;
  }else{
   const song=currentSong();
   if(song&&metadata){
    const originalTitle=song.title,originalAuthor=song.author;
    if(metadata.title&&/^(?:Canto fotografato|Canto senza titolo)/i.test(song.title||''))song.title=metadata.title;
    if(metadata.author&&!String(song.author||'').trim())song.author=metadata.author;
    if((song.title!==originalTitle||song.author!==originalAuthor)&&!saveStore(store)){
     song.title=originalTitle;song.author=originalAuthor;
    }
   }
  }
  state.ocrText=String(result.data?.text||'').trim().slice(0,20000);
  state.geometryRawText=state.ocrText;
  state.geometryDraft=window.CantoriaGeometry?.parseGeometry(result.data,{excludedRowIds:metadata?.excludedRowIds||[]})||null;
  const diag=state.geometryDraft?.diagnostics;
  if(!state.geometryDraft?.sections?.some(s=>s.lines?.length)){
   state.ocrStatus='Coordinate insufficienti per associare gli accordi. Salva la foto e riprova.';
  }else{
   state.ocrStatus='Coordinate conservate. '+diag.totalAnchored+' accordi; '+diag.needsReview+' da verificare.';
   if(replaceExisting){
    const song=currentSong();
    if(song?.photoData){
     const old={sections:song.sections,ocrText:song.ocrText,geometryDiagnostics:song.geometryDiagnostics,title:song.title,author:song.author,photoParserVersion:song.photoParserVersion,verified:song.verified,key:song.key};
     song.sections=structuredClone(state.geometryDraft.sections);
     refreshDetectedKey(song);
     song.ocrText=state.ocrText;
     song.geometryDiagnostics=structuredClone(diag);
     if(diag.refrainInferredFromRepeats&&/^Canto fotografato/i.test(song.title||''))song.title=diag.suggestedTitle;
     song.photoParserVersion=6;song.verified=false;
     if(!saveStore(store)){Object.assign(song,old);state.ocrStatus='Memoria insufficiente.';}
     else state.ocrStatus='Partitura ricalcolata. Verifica gli accordi nelle impostazioni.';
    }
   }
  }
 }catch(err){
  console.error('OCR:',err);
  state.ocrStatus='Riconoscimento non riuscito. Verifica la connessione e riprova.';
 }finally{
  if(worker){try{await worker.terminate();}catch(_){ }}
  state.ocrBusy=false;render();
 }
}

function replaceSyllable(marked,slot,newText){
 let n=0;
 return String(marked).split(/(\s+)/).map(chunk=>{
  if(!chunk||/^\s+$/.test(chunk))return chunk;
  return chunk.split('|').map(item=>{
   if(!item)return item;
   if(n++===slot)return newText;
   return item;
  }).join('|');
 }).join('');
}
// Remove exactly the selected sung syllable or its entire word while remapping
// anchor slots by identity, never by their old absolute positions.
function removeLyricSelection(line,slot,kind){
 if(!line||!Number.isInteger(slot)||!['syllable','word'].includes(kind))
  throw new Error('Selezione da eliminare non valida.');
 let cursor=0,targetWord=-1;
 const groups=String(line.marked||'').trim().split(/\s+/).filter(Boolean).map((word,wordIndex)=>{
  const cells=word.split('|').filter(Boolean).map(text=>({text,slot:cursor++}));
  if(cells.some(cell=>cell.slot===slot))targetWord=wordIndex;
  return cells;
 });
 if(targetWord<0)throw new Error('Sillaba non trovata.');
 const selected=groups[targetWord].find(cell=>cell.slot===slot);
 const removed=new Set(kind==='word'?groups[targetWord].map(cell=>cell.slot):[slot]);
 const slotMap=new Map();let nextSlot=0;
 const words=groups.map(cells=>cells.filter(cell=>!removed.has(cell.slot)).map(cell=>{
  slotMap.set(cell.slot,nextSlot++);return cell.text;
 }).join('|')).filter(Boolean);
 const anchors=(line.anchors||[]).filter(anchor=>slotMap.has(anchor.slot)).map(anchor=>({
  ...anchor,slot:slotMap.get(anchor.slot),
  // The original character offsets no longer refer to this edited lyric.
  anchorCharacterIndex:null,offsetX:0,needsReview:true,verified:false
 })).sort((a,b)=>a.slot-b.slot);
 return {marked:words.join(' '),anchors,removeLine:words.length===0,
  removedText:kind==='word'?groups[targetWord].map(cell=>cell.text).join(''):selected.text};
}

function readerCharRect(line,index){
 if(!Number.isInteger(index)||index<0)return null;
 let remaining=index;
 for(const span of line.children){
  const textNode=span.firstChild;
  if(!textNode||textNode.nodeType!==3)continue;
  const length=textNode.textContent.length;
  if(remaining>=length){remaining-=length;continue;}
  const range=document.createRange();
  range.setStart(textNode,remaining);
  range.setEnd(textNode,Math.min(remaining+1,length));
  const rect=range.getBoundingClientRect();
  return rect.width?rect:null;
 }
 return null;
}
// The longest fully rendered lyric line sets the exact same font size for

function fitSongToDisplay(){
 const layer=document.querySelector('#readerLayer');
 if(!layer||layer.classList.contains('reader-photo'))return;
 const column=layer.querySelector('.sheet-column');
 const song=currentSong();
 if(!column||!song)return;
 const lyric=column.querySelector('.lyric-line');
 const margin=lyric?parseFloat(getComputedStyle(lyric).marginLeft)||0:7;
 const available=Math.max(40,column.clientWidth-margin-8);
 const ctx=document.createElement('canvas').getContext('2d');
 if(!ctx)return;
 const base=26;
 ctx.font='normal '+base+'px Georgia, "Times New Roman", serif';
 let widest=1;
 for(const sec of song.sections||[])for(const line of sec.lines||[]){
  const text=window.CantoriaEditor.visibleLyric(line.marked||'');
  widest=Math.max(widest,ctx.measureText(text).width);
 }
 // A safety margin covers glyph rasterisation, span boundaries and iOS fonts.
 const fitted=Math.min(base,base*(available/Math.max(widest*1.04,1)));
 layer.style.setProperty('--reader-font',Math.max(1,fitted).toFixed(2)+'px');
 layer.dataset.fitWidth=String(available);
 layer.dataset.longestWidth=String(widest);
}
// Bind chord positions AFTER the global font has been applied. Pill height
// remains fixed. Crowded labels move only on the horizontal axis.
function alignChords(scope=document){
 for(const row of scope.querySelectorAll('.reader-layer .music-row')){
  const band=row.querySelector('.chord-band');
  if(!band)continue;
  const lyric=row.querySelector('.lyric-line');
  const labels=[...band.querySelectorAll('.chord-label')];
  band.style.width='100%';band.style.display='block';
  if(!labels.length)continue;
  const maxWidth=Math.max(24,band.clientWidth);
  const bandRect=band.getBoundingClientRect();
  const positions=[];
  labels.forEach((label,i)=>{
   label.style.position='absolute';
   label.style.transform='translateY(-50%)';
   label.style.top='50%';
   label.style.fontSize='';
   let x;
   if(lyric){
    const index=Number(label.dataset.charIndex);
    const precise=label.dataset.charIndex!==''&&Number.isInteger(index);
    const charRect=precise?readerCharRect(lyric,index):null;
    const syl=lyric.querySelector(`.syllable[data-slot="${label.dataset.slot}"]`);
    const rect=charRect||syl?.getBoundingClientRect();
    x=rect?rect.left-bandRect.left:0;
    if(charRect){
     const offset=Number(label.dataset.offsetX),width=Number(label.dataset.sourceCharWidth);
     if(Number.isFinite(offset)&&Number.isFinite(width)&&width>0)
      x+=(offset/width)*charRect.width;
    }
   }else{
    const ratio=Number(label.dataset.sourceRatio);
    x=Number.isFinite(ratio)&&label.dataset.sourceRatio!==''?
     ratio*maxWidth : (i+0.5)*maxWidth/labels.length-label.getBoundingClientRect().width/2;
   }
   positions.push({label,x:Math.max(0,x),width:label.getBoundingClientRect().width});
  });
  positions.sort((a,b)=>a.x-b.x);
  let gap=5;
  let total=positions.reduce((sum,p)=>sum+p.width,0)+gap*(positions.length-1);
  if(total>maxWidth-4){
   // Compress labels uniformly, without adding extra vertical lanes.
   const availableText=Math.max(2,maxWidth-6-gap*(positions.length-1));
   const scale=Math.max(.03,Math.min(1,availableText/Math.max(1,total-gap*(positions.length-1))));
   for(const p of positions){
    const original=parseFloat(getComputedStyle(p.label).fontSize)||13;
    p.label.style.fontSize=(original*scale).toFixed(2)+'px';
    p.width=p.label.getBoundingClientRect().width;
   }
   total=positions.reduce((sum,p)=>sum+p.width,0)+gap*(positions.length-1);
   if(total>maxWidth){gap=Math.max(0,(maxWidth-positions.reduce((sum,p)=>sum+p.width,0))/Math.max(1,positions.length-1));}
  }
  for(let i=1;i<positions.length;i++)
   positions[i].x=Math.max(positions[i].x,positions[i-1].x+positions[i-1].width+gap);
  const last=positions.at(-1);
  if(last.x+last.width>maxWidth){
   last.x=Math.max(0,maxWidth-last.width);
   for(let i=positions.length-2;i>=0;i--)
    positions[i].x=Math.min(positions[i].x,positions[i+1].x-positions[i].width-gap);
   if(positions[0].x<0){
    const shift=-positions[0].x;
    for(const p of positions)p.x+=shift;
   }
  }
  for(const p of positions)p.label.style.left=Math.max(0,p.x).toFixed(2)+'px';
 }
}

function compressScorePhoto(file){
 if(!file.type.startsWith('image/')||file.size>25000000)return Promise.reject(new Error('Formato o dimensione non supportati'));
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
   URL.revokeObjectURL(url);
   try{
    const maxSide=1450,scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas non disponibile');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    let data=canvas.toDataURL('image/jpeg',0.73);
    if(data.length>1800000){
      const shrink=Math.sqrt(1800000/data.length)*0.87;
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(canvas.width*shrink));c.height=Math.max(1,Math.round(canvas.height*shrink));
      c.getContext('2d').drawImage(canvas,0,0,c.width,c.height);
      data=c.toDataURL('image/jpeg',0.62);
    }
    if(data.length>2100000)throw new Error('Foto troppo grande');
    resolve(data);
   }catch(err){reject(err);}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Impossibile leggere la fotografia'));};
  img.src=url;
 });
}

}

function exportPdf(mode,songOverride=null,shiftOverride=state.shift){
 const song=songOverride||currentSong();if(!song)return;
 // Open preview while still in a direct user gesture: Safari may block delayed popups.
 const tab=mode==='preview'?window.open('','_blank'):null;
 try{
   const blob=makeCantoriaPdf(song,shiftOverride);
   const fileName='Cantoria-'+String(song.title||'spartito').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-_ ]/gi,'').trim().replace(/\s+/g,'-')+'.pdf';
   if(mode==='share'){
     if(typeof File==='undefined'||typeof navigator.share!=='function'||typeof navigator.canShare!=='function'){
       exportPdf('download',song,shiftOverride);return;
     }
     const file=new File([blob],fileName,{type:'application/pdf'});
     if(!navigator.canShare({files:[file]})){
       exportPdf('download',song,shiftOverride);return;
     }
     navigator.share({files:[file],title:fileName}).catch(err=>{
       if(err&&err.name!=='AbortError'){console.error(err);notify('Condivisione non riuscita. Prova Scarica PDF.');}
     });
     return;
   }
   const url=URL.createObjectURL(blob);
   setTimeout(()=>URL.revokeObjectURL(url),180000);
   if(mode==='preview'){
     if(tab){tab.location.replace(url);}
     else{
       const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
       notify('Se non si apre, prova Scarica PDF oppure Safari.');
     }
     return;
   }
   const a=document.createElement('a');a.href=url;a.download=fileName;
   document.body.appendChild(a);a.click();a.remove();
 }catch(err){
   if(tab&&!tab.closed)tab.close();
   console.error('Esportazione PDF:',err);
   notify('Non è stato possibile creare il PDF. Riprova da Safari.');
 }
}

 // Keep the active drag until its native touchend in that case.
 root.addEventListener('touchend',e=>{
  if(drag)finish(drag.pointerId);
 },{passive:true});
 window.addEventListener('pointercancel',e=>{
  if(pending&&e.pointerId===pending.pointerId)clearPending();
  if(drag&&e.pointerId===drag.pointerId&&e.pointerType!=='touch')cancel();
 });
 root.addEventListener('touchcancel',()=>cancel(),{passive:true});
 root.addEventListener('contextmenu',e=>{
  if(!eligible(e.target)&&!drag)return;
  if(e.cancelable)e.preventDefault();
 });
 root.addEventListener('click',e=>{
  if(Date.now()>skipClickUntil)return;
  if(!e.target.closest('.mass-song-tiles,.mass-song-ghost'))return;
  e.preventDefault();e.stopImmediatePropagation();
 },true);
 window.addEventListener('pagehide',()=>{clearPending();closeGhost();});
}
function setupLongPress(){
 let timer=null,x=0,y=0,pending=null;
 const cancel=()=>{if(timer){clearTimeout(timer);timer=null;}pending=null;};
 const activate=(target)=>{
  const si=Number(target.dataset.section),li=Number(target.dataset.line);
  if(!Number.isInteger(si)||!currentSong()?.sections?.[si])return;
  // A chord symbol has priority over its parent pill, even when the
  // chord text or its superscript is the initial pointer target.
  if(target.classList.contains('chord-label')){
   const ai=Number(target.dataset.chord);
   if(!Number.isInteger(ai)||ai<0)return;
   if(target.dataset.action==='edit-chord-only'){
    state.modal={type:'chord-only-edit',si,rowIndex:Number(target.dataset.rowIndex),ai};
    render();return;
   }
   if(target.dataset.action==='edit-chord'&&Number.isInteger(li)){
    openChordModal(si,li,ai);return;
   }
  }
  // Only untouched background of the colored chord bar changes its color.
  if(target.dataset.action==='edit-band'){
   const isChordOnly=target.hasAttribute('data-row-index');
   if(!isChordOnly&&!Number.isInteger(li))return;
   state.modal=isChordOnly?
    {type:'row-band-color',si,rowIndex:Number(target.dataset.rowIndex)}:
    {type:'row-band-color',si,li};
   render();return;
  }
  if(!Number.isInteger(li))return;
  state.modal={type:'syllable-edit',si,li,slot:Number(target.dataset.slot)};
  render();
 };
 root.addEventListener('pointerdown',e=>{
  if(e.button!==0||state.modal)return;
  const target=e.target.closest('#readerPaper .chord-label.editable, #readerPaper .chord-band[data-action="edit-band"], #readerPaper .syllable.clickable');
  if(!target)return;
  cancel();x=e.clientX;y=e.clientY;pending=target;
  timer=setTimeout(()=>{timer=null;const t=pending;pending=null;if(t)activate(t);},530);
 });
 root.addEventListener('pointermove',e=>{if(pending&&(Math.abs(e.clientX-x)>11||Math.abs(e.clientY-y)>11))cancel();});
 for(const type of ['pointerup','pointercancel','pointerleave'])root.addEventListener(type,cancel);
 root.addEventListener('contextmenu',e=>{
  const target=e.target.closest('#readerPaper .chord-label.editable, #readerPaper .chord-band[data-action="edit-band"], #readerPaper .syllable.clickable');
  if(!target)return;
  e.preventDefault();
  if(!state.modal){cancel();activate(target);}
 });
 // A single tap on a lyric opens its whole-line editor.
 // Long-press continues to edit one chord or one syllable precisely.
 root.addEventListener('click',e=>{
  const t=e.target.closest('#readerPaper [data-action="edit-chord"], #readerPaper [data-action="edit-chord-only"], #readerPaper [data-action="add-chord"]');
  if(t){e.preventDefault();e.stopImmediatePropagation();}
  const lyric=e.target.closest('#readerPaper .lyric-line[data-section][data-line]');
  if(lyric&&!state.modal){
   e.preventDefault();e.stopImmediatePropagation();
   state.modal={type:'lyric-edit',si:Number(lyric.dataset.section),li:Number(lyric.dataset.line)};
   render();
  }
 },true);
 root.addEventListener('keydown',e=>{
  if(!['Enter',' '].includes(e.key)||state.modal)return;
  const chord=e.target.closest('#readerPaper .chord-label.editable');
  if(chord){e.preventDefault();activate(chord);return;}
  const band=e.target.closest('#readerPaper .chord-band[data-action="edit-band"]');
  if(band){e.preventDefault();activate(band);return;}
  const lyric=e.target.closest('#readerPaper .lyric-line[data-section][data-line]');
  if(!lyric)return;
  e.preventDefault();
  state.modal={type:'lyric-edit',si:Number(lyric.dataset.section),li:Number(lyric.dataset.line)};
  render();
 });
 root.addEventListener('submit',e=>{
  if(e.target.id!=='syllableEditForm')return;
  e.preventDefault();e.stopImmediatePropagation();
  const m=state.modal,line=currentSong()?.sections[m.si]?.lines[m.li];if(!line)return;
  const form=new FormData(e.target);
  const syllable=String(form.get('syllable')||'').trim();
  const chord=window.CantoriaOCR?.chordName(String(form.get('chord')||'').trim())||'';
  if(!syllable||!/^([^\s|]+)(\|[^\s|]+)*$/.test(syllable)){alert('Sillabe non valide. Separa le sillabe con | e non usare spazi.');return;}
  const added=syllable.split('|').length-1;
  const textWasChanged=syllable.replaceAll('|','')!==parseSyllables(line.marked).filter(t=>!t.space)[m.slot]?.text;
  line.marked=replaceSyllable(line.marked,m.slot,syllable);
  if(textWasChanged){
   // Editing the lyric changes its character offsets. Preserve the original
   // source boxes, but require manual reassignment instead of guessing.
   for(const anchor of line.anchors){
    anchor.anchorCharacterIndex=null;anchor.needsReview=true;anchor.verified=false;
    anchor.offsetX=0;
   }
  }
  // Never shift a later chord to another sung syllable when a word is split.
  if(added)for(const anchor of line.anchors){if(anchor.slot>m.slot)anchor.slot+=added;}
  const existing=line.anchors.findIndex(a=>a.slot===m.slot);
  if(existing>=0){if(chord)line.anchors[existing].chord=chord;else line.anchors.splice(existing,1);}
  else if(chord)line.anchors.push({slot:m.slot,chord});
  line.anchors.sort((a,b)=>a.slot-b.slot);
  persist();state.modal=null;notify('Modifiche salvate');
 },true);
}
setupLongPress();
setupMassSongReorder();
let startX=0,startY=0;root.addEventListener('touchstart',e=>{if(!e.target.closest('#readerPaper')||e.target.closest('.modal-card'))return;const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;},{passive:true});
root.addEventListener('touchend',e=>{if(!e.target.closest('#readerPaper'))return;const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(window.innerWidth>window.innerHeight&&Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4){state.page+=dx<0?1:-1;state.page=Math.max(0,Math.min(pageList(currentSong()).length-1,state.page));render();}},{passive:true});
window.addEventListener('resize',()=>{if(state.songId){state.page=0;render();}});
window.addEventListener('beforeprint',()=>{const holder=document.querySelector('#print-sheet');if(holder&&currentSong()&&!holder.innerHTML)holder.innerHTML=`<div class="print-body"><div class="print-head">${escape(currentSong().title)}</div>${sectionsAllHTML(currentSong(),true)}</div>`;alignChords(holder||document);});
window.addEventListener('pagehide',()=>window.CantoriaAudioFollow?.stop());
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
// Both TestFlight's CFBundleVersion and Settings read the same release.json.
fetch('./release.json',{cache:'no-store'}).then(async response=>{
 if(!response.ok)throw new Error('release.json unavailable');
 const info=await response.json();
 if(info.version!=='1.1'||!Number.isSafeInteger(info.build)||info.build<1)throw new Error('Invalid release info');
 releaseInfo.version=info.version;releaseInfo.build=info.build;
 if(state.view==='settings'&&!state.songId)render();
}).catch(err=>console.warn('Impossibile leggere la build:',err));
