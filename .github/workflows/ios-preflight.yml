name: Cantoria iOS preflight (no release)

on:
  push:
    branches: [release/ios-preflight-20261119]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-readiness:
    name: Check signing inputs (names only)
    runs-on: ubuntu-latest
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
    steps:
      - name: Check which required settings exist without printing values
        shell: bash
        run: |
          set -euo pipefail
          status=0
          echo '## Cantoria TestFlight signing preflight' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks only the presence of values; it does not validate Apple certificates or upload an app.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          for name in IOS_BUNDLE_ID APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_KEYCHAIN_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then
              echo "- $name: configured" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $name: MISSING" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Missing TestFlight setting::$name is not configured"
              status=1
            fi
          done
          if [[ -n "${IOS_BUNDLE_ID:-}" && ! "$IOS_BUNDLE_ID" =~ ^[A-Za-z][A-Za-z0-9-]*(\.[A-Za-z][A-Za-z0-9-]*)+$ ]]; then
            echo "::error title=Invalid bundle ID::IOS_BUNDLE_ID must be a valid reverse-domain identifier"
            status=1
          fi
          exit "$status"

  ios-simulator:
    name: Compile unsigned iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Simulator-only fallback; this is NOT Cantoria's release bundle identifier.
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'org.cantoria.preflight' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native Capacitor app
        run: |
          npm install --no-audit --no-fund
          bash scripts/prepare-ios.sh
      - name: Compile for simulator without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=0.4.9 CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Save Xcode project for inspection
        if: always()
        run: |
          if [[ -d ios/App/App.xcodeproj ]]; then
            ditto -c -k --sequesterRsrc --keepParent ios Cantoria-iOS-project.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cantoria-ios-preflight-project
          path: Cantoria-iOS-project.zip
          if-no-files-found: ignore
          retention-days: 7
