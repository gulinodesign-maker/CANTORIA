name: Verify Cantoria web app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify photo-to-editable-score parser and app wiring
        run: |
          node scripts/test-photo-ocr.js
          node scripts/test-merged-chords.js
          node scripts/test-harmony.js
          node --check harmony-analysis.js
          node scripts/test-photo-geometry.js
          node scripts/test-photo-metadata.js
          node --check score-metadata.js
          node scripts/test-editor.js
          node scripts/test-syllable-delete.js
          node scripts/test-reader-fit.js
          node scripts/test-audio-follow.js
          node scripts/test-imported-audio.js
          node scripts/test-real-microphone.js
          node scripts/test-live-recovery.js
          node scripts/test-foreground-recovery.js
          node scripts/test-native-background-mic.js
          node scripts/test-fast-chords.js
          node scripts/test-audio-diagnostic.js
          node scripts/test-library-meta.js
          node scripts/test-library-filters.js
          node scripts/test-mass-cards.js
          node scripts/test-masses-redesign.js
          node scripts/test-mass-reorder.js
          node scripts/test-mass-landscape.js
          node scripts/test-home-mass-header.js
          node scripts/test-clean-mass-header.js
          node scripts/test-home-order-gear.js
          node scripts/test-release-info.js
          node scripts/test-settings-backup-nav.js
          node scripts/test-topbar-layout.js
          node scripts/test-portrait-toolbar-cross.js
          node scripts/test-mass-portrait.js
          node scripts/test-acquisition-liturgical.js
          node scripts/test-card-authors.js
          node scripts/test-library-accordion.js
          node scripts/test-library-landscape.js
          node scripts/test-release-pipeline.js
          node scripts/test-ios-launch-retry.js
          node scripts/test-ios-screen-awake.js
      - name: Check inline JS and generate a sample PDF
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const match=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!match)throw new Error('Inline script missing');
          const code=match[1];
          if(!code.includes('function recognizePhotoText(')||!code.includes('photoOcrFormHTML(true)'))throw new Error('Photo OCR flow missing');
          fs.writeFileSync('/tmp/cantoria.js',code);
          const first=code.slice(code.indexOf('const NOTE_NAMES'),code.indexOf('function normalizedSong('));
          const tonality=code.slice(code.indexOf('function describeTonality('),code.indexOf('function chordLabel('));
          const pdf=code.slice(code.indexOf('function makeCantoriaPdf('),code.indexOf('function exportPdf('));
          if(!first||!tonality||!pdf.includes('new Blob'))throw new Error('Cantoria musical model/PDF incomplete');
          const context=vm.createContext({Blob,TextEncoder});
          vm.runInContext(first+'\n'+tonality+'\n'+pdf,context);
          if(vm.runInContext("describeTonality({key:'SOL'},2)",context)!=='LA maggiore')throw new Error('Transpose key label failed');
          if(vm.runInContext("describeTonality({key:'SOL'},6)",context)!=='DO diesis maggiore')throw new Error('Sharp key label failed');
          const song={title:'Canto di prova',key:'SOL',verified:true,sections:[{name:'STROFA',kind:'verse',lines:[{marked:'Can|tia|mo con gio|ia',anchors:[{slot:0,chord:'SOL'},{slot:3,chord:'RE'}]}]}]};
          const blob=context.makeCantoriaPdf(song,2);
          blob.arrayBuffer().then(buffer=>{
            const text=Buffer.from(buffer).toString('latin1');
            if(!text.startsWith('%PDF-1.4')||!text.includes('/Count 1'))throw new Error('PDF content invalid');
            const marker=text.match(/startxref\n(\d+)/);
            if(!marker||text.slice(Number(marker[1]),Number(marker[1])+4)!=='xref')throw new Error('PDF xref invalid');
            console.log('Cantoria PDF smoke test passed:',buffer.byteLength,'bytes');
          }).catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          node --check /tmp/cantoria.js
