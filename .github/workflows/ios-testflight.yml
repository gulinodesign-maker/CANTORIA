name: Build iOS / TestFlight

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "Unsigned simulator build or signed TestFlight upload"
        type: choice
        required: true
        default: simulator
        options:
          - simulator
          - testflight

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 65
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Xcode
        run: xcodebuild -version

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate the native Xcode project
        run: bash scripts/prepare-ios.sh

      - name: Upload editable Xcode project
        run: ditto -c -k --sequesterRsrc --keepParent ios Cantoria-Xcode.zip

      - name: Save Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Cantoria-Xcode-${{ github.run_number }}
          path: Cantoria-Xcode.zip
          retention-days: 14

      - name: Build unsigned simulator app
        if: ${{ inputs.distribution == 'simulator' }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=0.4.9 CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build

      - name: Check distribution credentials
        if: ${{ inputs.distribution == 'testflight' }}
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          for name in IOS_BUNDLE_ID APPLE_TEAM_ID P12 P12_PASSWORD PROFILE KEYCHAIN_PASSWORD API_KEY API_KEY_ID API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required signing variable or secret: $name" >&2
              exit 1
            fi
          done

      - name: Import Apple Distribution signing assets
        if: ${{ inputs.distribution == 'testflight' }}
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY }}
        run: |
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/cantoria.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/cantoria.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/cantoria.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/cantoria.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -k "$RUNNER_TEMP/cantoria.keychain-db" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/cantoria.keychain-db"
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          if [[ "$profile_team" != "$APPLE_TEAM_ID" ]]; then
            echo "Provisioning profile Apple Team does not match APPLE_TEAM_ID." >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/distribution.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"

      - name: Archive signed app
        if: ${{ inputs.distribution == 'testflight' }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Cantoria.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION=0.4.9 CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export signed IPA
        if: ${{ inputs.distribution == 'testflight' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Cantoria.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          ls "$RUNNER_TEMP/export/"*.ipa

      - name: Save IPA
        if: ${{ inputs.distribution == 'testflight' }}
        uses: actions/upload-artifact@v4
        with:
          name: Cantoria-TestFlight-IPA-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Submit IPA to App Store Connect
        if: ${{ inputs.distribution == 'testflight' }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
