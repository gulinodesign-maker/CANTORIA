name: Cantoria TestFlight (automatic Apple signing)

# Pubblica automaticamente ogni versione integrata nel ramo principale.
# Il comando manuale rimane disponibile come opzione di recupero.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Annulla vecchie build: non caricare un commit precedente a main.
concurrency:
  group: cantoria-testflight-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 65
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate publication settings
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IOS_BUNDLE_ID APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID ASC_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing publication setting::$name is required"
              exit 1
            fi
          done
          if [[ ! "$IOS_BUNDLE_ID" =~ ^[A-Za-z][A-Za-z0-9-]*(\.[A-Za-z][A-Za-z0-9-]*)+$ ]]; then
            echo "::error title=Invalid bundle identifier::IOS_BUNDLE_ID is invalid"
            exit 1
          fi

      - name: Reject stale or mismatched checkout
        run: bash scripts/verify-release-payload.sh source

      - name: Prepare Apple API authentication
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          path="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$path"
          echo "ASC_AUTH_KEY_PATH=$path" >> "$GITHUB_ENV"

      - name: Prepare Cantoria iOS project
        run: |
          npm install --no-audit --no-fund
          bash scripts/prepare-ios.sh

      - name: Verify Capacitor staged this exact source
        run: bash scripts/verify-release-payload.sh staged

      # Simulator launch test removed from the automatic release path at the
      # maintainer's request. Source, archive, signing, and IPA integrity
      # checks below remain mandatory; visual smoke checks are optional.
      # Prevent ephemeral runners from creating new Apple Development
      # certificates on each TestFlight release (the account reached its limit).
      # The existing export step requests cloud-managed distribution signing.
      - name: Archive unsigned for Apple cloud distribution signing
        shell: bash
        run: |
          set -euo pipefail
          MARKETING_VERSION="$(node -p "require('./release.json').version")"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Cantoria.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$(node -p "require('./release.json').build")" \
            archive

      - name: Verify exact build and web sources in iOS archive
        run: bash scripts/verify-release-payload.sh archive

      - name: Verify archived export compliance declaration
        shell: bash
        run: |
          set -euo pipefail
          info="$RUNNER_TEMP/Cantoria.xcarchive/Products/Applications/App.app/Info.plist"
          test -f "$info"
          declared=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$info")
          if ! echo "$declared" | grep -Eiq '^(false|no|0)$'; then
            echo "::error::Missing or invalid ITSAppUsesNonExemptEncryption declaration"
            exit 1
          fi
          echo "Exempt encryption declaration found in archived iOS app."

      - name: Export IPA using Apple cloud signing
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Cantoria.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Reject stale upload and verify the signed IPA byte-for-byte
        run: bash scripts/verify-release-payload.sh ipa

      - name: Retain signed IPA as a short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cantoria-TestFlight-IPA-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Upload signed IPA to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove temporary Apple API key
        if: always()
        shell: bash
        run: |
          if [[ -n "${ASC_AUTH_KEY_PATH:-}" ]]; then rm -f "$ASC_AUTH_KEY_PATH"; fi
